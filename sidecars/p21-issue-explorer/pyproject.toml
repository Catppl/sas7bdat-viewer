[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p21-issue-explorer"
version = "0.1.0"
description = "Optional P21 Issue Explorer side-car for SASDataViewer"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "openpyxl>=3.1,<4",
]

[project.scripts]
p21-issue-explorer = "p21_issue_explorer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

