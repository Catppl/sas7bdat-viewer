[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sas7bdat-viewer"
version = "0.1.0"
description = "Fast, read-only Windows desktop viewer for clinical SAS7BDAT datasets"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "PySide6>=6.7,<7",
  "Jinja2>=3.1,<4",
  "pandas>=2.2,<4",
  "pyreadstat>=1.2,<2",
  "scipy>=1.11,<2",
]

[project.scripts]
sasdataviewer = "clinical_data_viewer.app:main"

[tool.setuptools.packages.find]
include = ["clinical_data_viewer*"]

[tool.setuptools.package-data]
"clinical_data_viewer.codegen.sas" = ["templates/*.j2"]
"clinical_data_viewer.codegen.r" = ["templates/*.j2"]
